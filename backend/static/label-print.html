<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>服装标签 · 40×60 mm</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef0f3; color: #18202c; font: 14px "Microsoft YaHei", sans-serif; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 16px 24px; background: white; border-bottom: 1px solid #dce0e6; }
    .toolbar strong { font-size: 16px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid #cdd2da; background: white; color: inherit; border-radius: 6px; padding: 9px 14px; cursor: pointer; }
    button.primary { background: #244b45; color: white; border-color: #244b45; }
    button:disabled { opacity: .5; cursor: wait; }
    #status { margin: 18px 24px; }
    #labels { display: grid; justify-content: center; gap: 18px; padding: 6px 16px 24px; }
    .label { margin: 0; width: 40mm; height: 60mm; background: white; box-shadow: 0 2px 8px #17202b20; }
    .label img { display: block; width: 40mm; height: 60mm; }
    @page { size: 40mm 60mm; margin: 0; }
    @media print {
      html, body { margin: 0; padding: 0; background: white; }
      .toolbar, #status { display: none; }
      #labels { display: block; padding: 0; margin: 0; }
      .label { box-shadow: none; break-after: page; page-break-after: always; break-inside: avoid; }
      .label:last-child { break-after: auto; page-break-after: auto; }
      .label img { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <strong>服装标签 · 40×60 mm</strong>
    <div class="actions"><button id="download" disabled>下载标签 PNG</button><button class="primary" id="print" disabled>系统打印</button></div>
  </header>
  <p id="status" role="status">正在生成标签...</p>
  <main id="labels"></main>
  <script src="/static/label-print.js"></script>
</body>
</html>
